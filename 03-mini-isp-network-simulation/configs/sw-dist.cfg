! =============================================================================
! SW-DIST — Distribution Switch (Layer 3 capable, e.g. Cisco 3560)
! Role: VLAN segmentation, inter-VLAN routing, customer attachment
! =============================================================================

hostname SW-DIST

enable secret MetroLink2024
ip routing

! --- VLAN definitions ---
vlan 10
 name INFRA
vlan 20
 name SERVICES
vlan 100
 name CUST-ACME
vlan 101
 name CUST-BETA

! --- Trunk to core router ---
interface GigabitEthernet0/1
 description Uplink to R-ISP-CORE
 switchport mode trunk
 switchport trunk native vlan 10
 switchport trunk allowed vlan 10,20,100,101
 no shutdown

! --- Access ports ---
interface FastEthernet0/1
 description SRV-DHCP
 switchport mode access
 switchport access vlan 20

interface FastEthernet0/2
 description SRV-DNS
 switchport mode access
 switchport access vlan 20

interface FastEthernet0/3
 description SRV-PORTAL
 switchport mode access
 switchport access vlan 20

interface FastEthernet0/10
 description R-ACME WAN
 switchport mode access
 switchport access vlan 100

interface FastEthernet0/11
 description R-BETA WAN
 switchport mode access
 switchport access vlan 101

! --- Layer 3 SVIs (gateways) ---
interface Vlan10
 description Infrastructure
 ip address 10.0.0.2 255.255.255.240

interface Vlan20
 description Services
 ip address 10.0.0.33 255.255.255.224

interface Vlan100
 description Customer A — Acme Corp
 ip address 192.168.100.254 255.255.255.0
 ip helper-address 10.0.0.34

interface Vlan101
 description Customer B — Beta LLC
 ip address 192.168.101.254 255.255.255.0
 ip helper-address 10.0.0.34

! --- Default route via core ---
ip route 0.0.0.0 0.0.0.0 10.0.0.1

! --- Management ---
line vty 0 4
 login local
 transport input ssh
username admin privilege 15 secret MetroLink2024

end
