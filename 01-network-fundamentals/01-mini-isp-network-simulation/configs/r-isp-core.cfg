! =============================================================================
! R-ISP-CORE — MetroLink ISP Core Router
! Device: Cisco 2911 (or equivalent)
! Role: Upstream connectivity, inter-customer routing, NAT to internet
! =============================================================================

hostname R-ISP-CORE

! --- Basic security & management ---
enable secret MetroLink2024
service password-encryption
line console 0
 logging synchronous
 login local
line vty 0 4
 login local
 transport input ssh
username admin privilege 15 secret MetroLink2024

! --- Interface configuration ---
interface Loopback0
 description Router ID and management
 ip address 10.255.0.1 255.255.255.255

interface GigabitEthernet0/0
 description Upstream peer link
 ip address 203.0.113.1 255.255.255.252
 ip nat outside
 no shutdown

interface GigabitEthernet0/1
 description ISP backbone to distribution switch
 ip address 10.0.0.1 255.255.255.0
 ip nat inside
 no shutdown

! --- Static routing ---
ip route 192.168.100.0 255.255.255.0 10.0.0.2
ip route 192.168.101.0 255.255.255.0 10.0.0.2
ip route 0.0.0.0 0.0.0.0 203.0.113.2

! --- NAT overload (PAT) for customer traffic to internet ---
access-list 1 permit 10.0.0.0 0.0.0.255
access-list 1 permit 192.168.100.0 0.0.0.255
access-list 1 permit 192.168.101.0 0.0.0.255
ip nat inside source list 1 interface GigabitEthernet0/0 overload

! --- DNS for management (optional) ---
ip name-server 10.0.0.35
ip domain-name metrolink.local

end
