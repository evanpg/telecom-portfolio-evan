! =============================================================================
! SRV-DHCP — DHCP Server Configuration Reference
! Apply on Server-PT or IOS DHCP service; pools defined here for documentation
! Server IP: 10.0.0.34/27 (VLAN 20)
! =============================================================================

! --- IOS-style DHCP pools (if running on a router instead of Server-PT) ---

ip dhcp excluded-address 192.168.100.1 192.168.100.49
ip dhcp excluded-address 192.168.100.201 192.168.100.254

ip dhcp pool ACME-LAN
 network 192.168.100.0 255.255.255.0
 default-router 192.168.100.1
 dns-server 10.0.0.35
 lease 7

ip dhcp excluded-address 192.168.101.1 192.168.101.49
ip dhcp excluded-address 192.168.101.201 192.168.101.254

ip dhcp pool BETA-LAN
 network 192.168.101.0 255.255.255.0
 default-router 192.168.101.1
 dns-server 10.0.0.35
 lease 7

! --- Packet Tracer Server-PT settings ---
! Service tab → DHCP:
!   Pool name: ACME-LAN
!   Default gateway: 192.168.100.1
!   DNS server: 10.0.0.35
!   Start IP: 192.168.100.50
!   Subnet mask: 255.255.255.0
!   Max users: 150
!
! Repeat for BETA-LAN with 192.168.101.x range.

! --- DNS zone reference (configure on SRV-DNS 10.0.0.35) ---
! Zone: metrolink.local
!   portal  A  10.0.0.36
!   dns     A  10.0.0.35
!   dhcp    A  10.0.0.34

end
